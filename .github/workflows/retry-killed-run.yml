name: Retry a run whose runner was taken away

# GitHub sometimes reclaims a hosted runner mid-job. The job dies wherever it happened to
# be, with "The runner has received a shutdown signal" and exit 143, and it is reported as a
# failure like any other. It has happened repeatedly here, always inside npm ci (the git-hosted
# libs each install and compile in parallel there), and sometimes twice in a row on one commit.
#
# The retry loop around npm ci cannot help: the whole machine goes away, not just the
# command. So this listens for a failed run and re-runs it, but only after reading the log
# and finding that message (or finding no log at all, which is what a vanished runner leaves). A build that failed on its own merits is left failed, because a
# red build that quietly goes green on a second try is worse than a flaky one.

on:
  workflow_run:
    workflows: ["Build Android APK", "Deploy to GitHub Pages", "CI"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    # Up to three attempts, so a rerun that is killed again gets one more go.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run it if the runner was shut down under it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/logs" > logs.zip 2>/dev/null; then
            # a runner that vanished takes its log with it
            echo "No log for run $RUN_ID; the runner was lost. Re-running the failed jobs."
            gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            exit 0
          fi
          if unzip -p logs.zip | grep -q "The runner has received a shutdown signal"; then
            echo "Run $RUN_ID lost its runner. Re-running the failed jobs."
            gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
          else
            echo "Run $RUN_ID failed on its own merits. Leaving it failed."
          fi
