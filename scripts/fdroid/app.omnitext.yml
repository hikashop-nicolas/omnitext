Categories:
  - Local Media Player
  - Reading
  - Text Editor
License: MIT
AuthorName: hikashop-nicolas
AuthorWebSite: https://github.com/hikashop-nicolas
SourceCode: https://github.com/hikashop-nicolas/omnitext
IssueTracker: https://github.com/hikashop-nicolas/omnitext/issues

AutoName: Omnitext

RepoType: git
Repo: https://github.com/hikashop-nicolas/omnitext.git

Builds:
  - versionName: '1.7'
    versionCode: 10700
    commit: bf5bee43e7ae67a6a4d28cd535222e6de4d3358c
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends python3 make patch gcc libc6-dev
        curl unzip pkg-config libatomic1 perl libdigest-sha3-perl xz-utils bzip2 cmake
        ragel libtool libtool-bin itstool python3-ply gettext autopoint automake autoconf
        m4 gperf licensecheck gawk
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
      - echo "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  /tmp/node.tar.xz"
        | sha256sum -c
      - tar xJf /tmp/node.tar.xz -C /opt
      - ln -sf /opt/node-v24.21.0-linux-x64/bin/node /opt/node-v24.21.0-linux-x64/bin/npm
        /opt/node-v24.21.0-linux-x64/bin/npx /usr/local/bin/
    gradle:
      - yes
    build:
      - cd ../..
      - npm ci
      - scripts/fdroid/build-wasm.sh
      - npm run build
      - npx cap sync android

AutoUpdateMode: Version fdroid-%v
UpdateCheckMode: Tags ^fdroid-
UpdateCheckData: android/app/build.gradle|fdroidVersionCode = (\d+)|.|versionName
  "(.*)"
CurrentVersion: '1.7'
CurrentVersionCode: 10700
